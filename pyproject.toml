[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "t0"
version = "0.1.4"
description = "Self-hosted Garmin Connect data ingestion and visualization pipeline."
readme = "README.md"
# Upper bound assumed: CI, mypy (`python_version`), ruff target, and Docker image
# are all on 3.12. Widening the bound without widening the CI matrix would mean
# promising untested support.
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Lukas" }]

dependencies = [
    "garminconnect==0.3.2",
    "garmin-fit-sdk==21.213.0",
    "psycopg[binary]==3.2.3",
    # Connection pooling for the MCP read-only role (t0.mcp.db): the official
    # companion package, kept explicit rather than letting the mcp pin drag it in.
    "psycopg-pool==3.2.6",
    "apscheduler==3.10.4",
    "fastapi==0.115.5",
    # Required AT RUNTIME by File()/UploadFile parameters of the upload endpoint
    # (t0.api.upload): FastAPI does not pull it itself, and its absence only
    # shows up on first actual send, not on import.
    "python-multipart==0.0.20",
    "uvicorn[standard]==0.32.1",
    # 2.11 floor is the mcp SDK's own requirement (1.x line); pydantic-settings
    # 2.6.1 accepts it, so only pydantic itself moves.
    "pydantic==2.11.7",
    "pydantic-settings==2.6.1",
    # MCP server. 1.x line pinned: 2.x restructured the
    # whole public API (mcp.server.mcpserver) for too little gain here, and the
    # 1.x line is the one documented for streamable HTTP + stateless mode.
    "mcp==1.29.1",
    "prometheus-client>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.8.1",
    "mypy==1.13.0",
    # Required by starlette.testclient.TestClient: without it, the ENTIRE HTTP layer of
    # the upload endpoint is silently skipped by pytest.
    "httpx==0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/t0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=t0 --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
    "RUF",  # ruff rules
    "S",    # flake8-bandit
    "A",    # flake8-builtins
    "PL",   # pylint
    "TCH",  # flake8-type-checking
]
ignore = [
    "PLR0913", # too many arguments: ingestion signatures legitimately have many
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["t0"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["garminconnect.*", "garmin_fit_sdk.*", "apscheduler.*"]
ignore_missing_imports = true
