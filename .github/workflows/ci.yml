name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Token only needs to read the repository: CI publishes nothing.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned by SHA: a tag `v4` is mutable, a SHA is not.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy
        run: mypy src tests

      - name: pytest
        run: pytest

      - name: Validate Helm renders
        run: |
          for values in deploy/helm/garminator/ci/*.yaml; do
            helm lint deploy/helm/garminator --values "$values"
            helm template garminator deploy/helm/garminator --values "$values" > /dev/null
          done

  docker-build:
    # L0 acceptance criterion: image builds. We push nothing here, publication is
    # the role of publish-image.yml on a tag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build image (no publication)
        run: docker build --tag garminator-ingest:ci .

      - name: Verify container does not run as root
        run: |
          uid="$(docker run --rm --entrypoint sh garminator-ingest:ci -c 'id -u')"
          test "$uid" -ne 0 || { echo "Image runs as root"; exit 1; }

      - name: Verify no compiler in final image
        run: |
          if docker run --rm --entrypoint sh garminator-ingest:ci \
               -c 'command -v gcc || command -v cc || command -v g++'; then
            echo "Compiler present in final image"
            exit 1
          fi

      - name: Verify image serves API by default
        run: |
          docker run --detach --rm --name garminator-api -p 8080:8080 garminator-ingest:ci
          trap 'docker stop garminator-api' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/openapi.json
