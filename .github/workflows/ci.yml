name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Le jeton n'a besoin que de lire le dépôt : la CI ne publie rien.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      # Actions épinglées par SHA : un tag `v4` est mutable, un SHA ne l'est pas.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Installer Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Installer le paquet et ses dépendances de dev
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy
        run: mypy src tests

      - name: pytest
        run: pytest

  docker-build:
    # Critère d'acceptation du lot L0 : l'image se construit. On ne pousse rien
    # ici, la publication est le rôle de publish-image.yml sur un tag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Construire l'image (sans publication)
        run: docker build --tag garminator-ingest:ci .

      - name: Vérifier que le conteneur ne tourne pas en root
        run: |
          uid="$(docker run --rm --entrypoint sh garminator-ingest:ci -c 'id -u')"
          test "$uid" -ne 0 || { echo "L'image tourne en root"; exit 1; }

      - name: Vérifier l'absence de compilateur dans l'image finale
        run: |
          if docker run --rm --entrypoint sh garminator-ingest:ci \
               -c 'command -v gcc || command -v cc || command -v g++'; then
            echo "Un compilateur est présent dans l'image finale"
            exit 1
          fi
