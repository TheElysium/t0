name: Publish image

on:
  push:
    tags: ["v*.*.*"]

# Strict minimum: read sources, write to GHCR package. Nothing else.
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned by SHA: a tag `v3`/`v6` is mutable, a SHA is not.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # We do not publish an image whose test suite has not been replayed on the
      # tagged commit.
      - name: Replay checks before publication
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          ruff check .
          ruff format --check .
          mypy src tests
          pytest
          for values in deploy/helm/t0/ci/*.yaml; do
            helm lint deploy/helm/t0 --values "$values"
            helm template t0 deploy/helm/t0 --values "$values" > /dev/null
          done

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
