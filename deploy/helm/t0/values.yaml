# values.yaml -- t0
#
# Chart designed for STRICTLY LOCAL access by default: no Ingress, no TLS.
# Services are ClusterIP; access is via `kubectl port-forward`. Grafana has two
# optional LAN exposure modes -- LoadBalancer Service or Gateway HTTPRoute
# (grafana.gateway) -- both plain HTTP, never routed in from outside. See the
# chart README for exact commands, including manual creation of the Garmin
# Secret (never created by this chart).

# -----------------------------------------------------------------------
# Logical namespace / common labeling
# -----------------------------------------------------------------------
nameOverride: ""
fullnameOverride: ""

commonLabels: {}

# -----------------------------------------------------------------------
# Garmin Secret -- REFERENCE, NEVER CREATED BY THIS CHART.
#
# This Secret is equivalent to full account access. It must be created manually
# by the athlete BEFORE `helm install`, with at least the keys `username` and
# `password`.
# See README.md for the exact `kubectl create secret generic` command.
# A Kubernetes Secret is base64-encoded, NOT encrypted: anyone with
# access to the API server or unencrypted etcd can read it in plain text.
# -----------------------------------------------------------------------
garminSecret:
  # Name of existing Secret to reference (will NOT be created by this chart).
  name: t0-garmin-credentials
  usernameKey: username
  passwordKey: password

# -----------------------------------------------------------------------
# PostgreSQL
#
# Two modes:
#   - embedded (default, `enabled: true`): this chart deploys its own
#     PostgreSQL StatefulSet + Service + Secret in the release namespace.
#   - external (`enabled: false`): connect to a server this chart does not
#     manage -- e.g. a CloudNativePG cluster. Then `external.host` is
#     MANDATORY, the chart deploys no StatefulSet/Service, and credentials
#     MUST come from a pre-existing Secret via `auth.existingSecret`
#     (keys `username` and `password`) -- the `<cluster>-app` Secret of a
#     CNPG cluster matches this shape. Secrets are namespaced: when the
#     external server lives in another namespace, copy its Secret into the
#     release namespace first and reference the copy.
# -----------------------------------------------------------------------
postgresql:
  enabled: true

  external:
    # Host of the external server, e.g. with CloudNativePG the read-write
    # Service: "<cluster>-rw.<namespace>.svc" (short form "<cluster>-rw" only
    # works from the same namespace). Ignored while `enabled` is true.
    host: ""
    port: 5432
    # Namespace of the external server, used ONLY by the NetworkPolicy egress
    # rule (a pod selector never crosses a namespace boundary). Empty = any
    # namespace, still restricted to the database port.
    namespace: ""

  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  # PostgreSQL application credentials (DB service account, distinct from
  # Garmin account). Created by this chart in a dedicated Secret, because
  # these are not Garmin credentials -- no risk of associated account lockout.
  auth:
    database: t0
    username: t0
    # MANDATORY if `existingSecret` is empty. NO random generation:
    # the real PostgreSQL password is frozen by `initdb` at data volume creation
    # and is never read from POSTGRES_PASSWORD again. A password regenerated on
    # every `helm upgrade` would create a Secret out of sync with the volume: the
    # application would be denied authentication on a database that worked the day
    # before.
    # Generate once then keep in a local values file (outside git repository):
    #     openssl rand -base64 32 | tr -d '/+=' | cut -c1-32
    password: ""
    # Alternative: pre-existing Kubernetes Secret with keys `username` and
    # `password`. When set, the chart creates no PostgreSQL Secret and the
    # `password` above is ignored.
    existingSecret: ""

  service:
    port: 5432

  # fsGroup of the data volume. The `postgres:*-alpine` image uses
  # postgres user uid/gid 70 (not 999 like the Debian variant).
  podSecurityContext:
    fsGroup: 70

  persistence:
    enabled: true
    storageClassName: ""
    size: 10Gi
    accessModes:
      - ReadWriteOnce
    # Subdirectory of the mounted volume used as PGDATA. Never point PGDATA
    # at the mount point root (cached files `lost+found` from some provisioners).
    pgdataSubPath: pgdata

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  # Probes based on pg_isready.
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# -----------------------------------------------------------------------
# Schema migrations -- Helm hook Job, see templates/migrate-job.yaml
#
# Runs `python -m t0.db migrate` on post-install and pre-upgrade. Nothing else
# creates the schema, so disabling this leaves an empty database and the
# scheduler CronJob fails on its first write. Disable it only to apply the
# migrations by hand (`kubectl create job --from=...` is not enough: a hook Job
# is deleted once it succeeds).
#
# Uses the ingest image and the ingest security contexts: it is the same
# artifact, running a different command.
# -----------------------------------------------------------------------
migrate:
  enabled: true
  # A migration failure is almost never transient (a syntax error, a checksum
  # drift): retrying twice is enough to absorb a lost connection, and beyond
  # that the failure must surface.
  backoffLimit: 2
  # Ceiling on the whole Job, init container included. Helm blocks on the hook
  # for the duration, so this also bounds `helm upgrade`.
  activeDeadlineSeconds: 900
  # How long the init container waits for PostgreSQL to accept connections. On a
  # fresh install the StatefulSet is often still starting when the hook fires.
  waitForPostgresqlSeconds: 300
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
# -----------------------------------------------------------------------
# t0-ingest -- poll Garmin, parse FIT, calculations, upload endpoint
# -----------------------------------------------------------------------
ingest:
  replicaCount: 1

  image:
    # Image published by CI on GHCR (.github/workflows/publish-image.yml, which
    # uses ghcr.io/${{ github.repository }}). Lowercase: GHCR does not accept
    # uppercase in image names, whereas the repository is spelled TheElysium.
    repository: ghcr.io/theelysium/t0
    tag: ""            # default: .Chart.AppVersion
    pullPolicy: IfNotPresent
  imagePullSecrets: []

  service:
    enabled: true
    type: ClusterIP
    port: 8080

  # Non-sensitive environment variables (ConfigMap). Garmin credentials and
  # PostgreSQL password arrive via Secret (secretKeyRef), never via this
  # ConfigMap.
  config:
    # Application log verbosity. Rendered in ConfigMap as T0_LOG_LEVEL
    # and used identically by ops CronJobs, which do not mount this ConfigMap.
    # Values: DEBUG, INFO, WARNING, ERROR. An unknown value does NOT fail the
    # pod: fallback to INFO, signaled by a warning in the log itself.
    logLevel: INFO
    # Path to Garmin token store (persistent session). WITHOUT this variable,
    # each pod restart would trigger a complete SSO authentication, exposing
    # the account to lockout.
    garminTokensPath: /data/garmin-tokens
    fitArchivePath: /data/fit-archive
    # NOTE: no cadence setting here. Polling is a CronJob (`scheduler.schedule`),
    # not an internal Deployment loop.
    # Backfill start date (batch L10) -- actual history start.
    backfillStartDate: "2025-04-03"
    # Athlete's timezone, used for day boundaries.
    timezone: "Europe/Paris"

  # Additional free environment variables (list [{name, value}]
  # or [{name, valueFrom}]), merged after those generated by the chart.
  extraEnv: []

  # Maximum size of emptyDir mounted on /tmp (root filesystem read-only).
  # Limits node ephemeral storage usage by FIT downloads.
  tmpDirSizeLimit: 1Gi

  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# -----------------------------------------------------------------------
# t0-mcp -- MCP server: read-only data access for an LLM (docs/HANDOFF-MCP.md)
# -----------------------------------------------------------------------
# A NEW, SEPARATE process -- never merged into ingest. It reuses the SAME
# Docker image (same artifact, different command: `python -m t0.mcp`) but gets
# its own Deployment and Service, so that exposing the MCP can never, by
# construction, expose the unauthenticated ingest upload endpoint. Only the MCP
# Service may get an HTTPRoute; ingest stays ClusterIP whatever happens.
mcp:
  enabled: false

  replicaCount: 1

  image:
    # Same image as ingest: another entry point of the same Python package.
    repository: ghcr.io/theelysium/t0
    tag: ""            # default: .Chart.AppVersion
    pullPolicy: IfNotPresent
  # Same image, same registry as ingest: set ingest.imagePullSecrets, read here too.

  service:
    type: ClusterIP
    port: 8080

  # Static Bearer token in a Kubernetes Secret -- never generated by the chart
  # (same rule as postgresql.auth: a regenerated token would break the client).
  auth:
    bearerTokenExistingSecret: ""
    bearerTokenKey: token
    # Offline validation ONLY (the chart creates the Secret from this value).
    bearerToken: ""

  # Dedicated read-only role t0_mcp_ro, never the application credentials. The
  # role and its DSN Secret are created server-side (CNPG managed.roles);
  # this chart only references the Secret.
  postgres:
    dsnExistingSecret: ""
    dsnKey: dsn

  # Passed as T0_MCP_* environment variables (read through t0.settings).
  config:
    logLevel: INFO
    statementTimeoutMs: 10000
    maxRows: 500

  tmpDirSizeLimit: 64Mi

  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # Exposure through the shared Gateway (HTTPRoute), same mechanism and same
  # gating idiom as grafana.gateway: the chart refuses to render an HTTPRoute
  # without an explicit hostname. Plain HTTP on the LAN, like every exposure of
  # this chart; real TLS is a separate homelab task the MCP inherits unchanged.
  gateway:
    enabled: false
    # MANDATORY when `enabled` is true. An implicit default would silently
    # publish the MCP under a name nobody chose.
    hostname: ""
    parentRefs:
      - name: homelab
        namespace: gateway-system
        sectionName: http

# -----------------------------------------------------------------------
# Pod scheduling (applies to every workload of the release)
# -----------------------------------------------------------------------
# The fit-archive PVC below is ReadWriteOnce and is mounted by five workloads
# (ingest, scheduler, transform, ops-reconcile, backup). On a single-node cluster
# nothing is needed here. On a multi-node cluster with node-local storage
# (k3s local-path, hostPath...), a pod scheduled on another node stays Pending
# forever: pin the release to the node holding the volume, for example
#   nodeSelector:
#     kubernetes.io/hostname: homelab-node-1
# The alternative is a ReadWriteMany StorageClass (NFS, Longhorn), declared in
# fitArchive.persistence.storageClassName + accessModes.
scheduling:
  nodeSelector: {}
  affinity: {}
  tolerations: []

# -----------------------------------------------------------------------
# FIT file archive -- PVC shared between ingestion and backup CronJob.
# Also contains Garmin token store (subdirectory) and PostgreSQL dumps
# (subdirectory), to remain at THREE PVCs.
# -----------------------------------------------------------------------
fitArchive:
  persistence:
    storageClassName: ""
    size: 20Gi
    accessModes:
      - ReadWriteOnce
  # Subdirectories (subPath) in this single PVC.
  subPaths:
    fitFiles: fit-files
    garminTokens: garmin-tokens
    postgresBackups: postgres-backups

# -----------------------------------------------------------------------
# Grafana
# -----------------------------------------------------------------------
grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: "11.1.0"
    pullPolicy: IfNotPresent

  # Grafana.com plugin ids installed at container start (GF_INSTALL_PLUGINS).
  # Empty on purpose: the only dashboard that needed a plugin was the data-entry
  # form (volkovlabs-form-panel), and that dashboard is gone. Manual RPE now goes
  # through the API endpoint instead.
  # COST OF ADDING ONE BACK: the pod downloads plugins over HTTPS from grafana.com
  # at startup, so the NetworkPolicy opens outbound 443 for Grafana WHILE this list
  # is non-empty. Keeping it empty holds Grafana to PostgreSQL-only egress.
  plugins: []

  service:
    # ClusterIP keeps Grafana reachable through `kubectl port-forward` only.
    #
    # LoadBalancer is the other accepted value, for a stable address on the LAN.
    # It is a deliberate step: Grafana asks for the admin password, but it serves
    # plain HTTP, so this is only reasonable on a network you trust. NodePort is
    # refused outright -- see templates/grafana-service.yaml.
    #
    # The ingestion Service is NOT covered by this relaxation: its upload endpoint
    # is unauthenticated and stays ClusterIP whatever happens.
    type: ClusterIP
    port: 3000
    # Annotations on the Service, typically to claim a fixed LoadBalancer address.
    # The key depends on the implementation, which is why nothing is assumed here:
    #   Cilium LB-IPAM: lbipam.cilium.io/ips: "192.168.1.211"
    #   MetalLB:        metallb.universe.tf/loadBalancerIPs: "192.168.1.211"
    # Without one, the pool hands out the next free address, which moves between
    # reinstalls -- fine for a test, annoying for a bookmark.
    annotations: {}

  # Exposure through the Kubernetes Gateway API (HTTPRoute), for clusters that
  # run one -- e.g. the shared Cilium Envoy Gateway in `gateway-system`. The
  # route consumes no LoadBalancer address and serves Grafana under a real
  # hostname. Plain HTTP end to end: same trust model as the LoadBalancer mode,
  # LAN only, never routed in from outside.
  #
  # The Service type is independent of this switch: with `service.type:
  # LoadBalancer` AND `gateway.enabled: true` both set, Grafana is reachable
  # through BOTH paths at once -- that is exactly the zero-downtime migration
  # sequence (attach the route while the LB still exists, then flip the Service
  # back to ClusterIP once the hostname is the habit). The LoadBalancer path
  # stays the fallback for clusters without a Gateway.
  gateway:
    enabled: false
    # MANDATORY when `enabled` is true -- the chart refuses to render an
    # HTTPRoute without an explicit hostname, the same way it refuses an
    # unplanned Service type. An implicit default would silently publish
    # Grafana under a name nobody chose.
    hostname: ""
    parentRefs:
      - name: homelab
        namespace: gateway-system
        sectionName: http

  persistence:
    enabled: true
    storageClassName: ""
    size: 2Gi
    accessModes:
      - ReadWriteOnce

  # Local admin credential (access via port-forward, no Ingress).
  # `password` is MANDATORY if `existingSecret` is empty: no random generation,
  # so a `helm upgrade` never drifts the Secret content from what the athlete noted.
  admin:
    user: admin
    password: ""
    # Pre-existing Secret with keys `admin-user` and `admin-password`.
    existingSecret: ""

  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # Dashboard provisioning location (batch L9).
  # This chart creates the ConfigMap and mounting mechanism; the CONTENT
  # (dashboard JSON files) is deliberately left empty and will be filled by
  # batch L9. To add dashboards without modifying the chart, it is also
  # possible to provide dashboardsConfigMapName.
  dashboards:
    # If empty, an empty `<fullname>-grafana-dashboards` ConfigMap is created
    # and mounted -- ready to receive `*.json` keys (L9).
    configMapName: ""

  # A Grafana serving five dashboards to one athlete sits around 150Mi resident.
  # The limit is a ceiling against a runaway query, not a reservation: it is kept
  # tight because the target cluster has roughly 2Gi of headroom in total.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# -----------------------------------------------------------------------
# PostgreSQL backup -- weekly pg_dump CronJob
# -----------------------------------------------------------------------
backup:
  enabled: true
  schedule: "0 3 * * 0"    # Sunday 03:00
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  # Number of dumps to keep (simple rotation by purging oldest).
  retention: 8
  # Delay beyond which a missed trigger (node down, cluster stopped) is NOT
  # caught up. Without this limit, a CronJob with more than 100 missed triggers
  # stops running permanently.
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# -----------------------------------------------------------------------
# Operations (batch L10) -- CronJobs `python -m t0.ops ...`.
# Reuse the ingest image: `t0.ops` is part of the same Python package,
# no second image to build.
# -----------------------------------------------------------------------

# Materialized view refresh (mart.*) -- to schedule AFTER daily polling:
# refreshing before would just recopy yesterday's state. The module auto-switches
# to non-concurrent mode for an unpopulated view (REFRESH ... CONCURRENTLY refuses it),
# then switches back to concurrent on subsequent runs.
# Transformation raw.fit_file -> core.* -- the link that feeds the views.
# See templates/transform-cronjob.yaml. Scheduled BETWEEN each polling cycle and
# its ops-refresh (+15 min / +30 min): refreshing empty core.* tables SUCCEEDS and
# leaves dashboards blank with no alarm signal.
transform:
  enabled: true
  schedule: "15 10,15,22 * * *"   # 10:15, 15:15, 22:15 -- 15 min after each poll
  # Maximum number of files processed per run. Several short runs beat one long
  # run that a pod eviction would reset to zero: each transformed file is committed
  # individually, a run interrupted loses only the current file. Initial backfill
  # (history from ingest.config.backfillStartDate) is absorbed over several nights;
  # increase this value temporarily or trigger a manual Job with
  # `kubectl create job --from=cronjob/...` to accelerate it.
  batchLimit: 200
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      # FIT decoding and series calculation are done in memory, one file at
      # a time: peak follows session duration, not batch size.
      cpu: "1"
      memory: 1Gi

opsRefresh:
  enabled: true
  schedule: "30 10,15,22 * * *"   # 10:30, 15:30, 22:30 -- 30 min after each poll
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# PVC <-> raw.fit_file reconciliation (read-only). See
# templates/ops-reconcile-cronjob.yaml. Scheduled AFTER ops-refresh and
# polling: a scan during archiving would see transient state (file written,
# row not yet inserted) and cry orphan.
opsReconcile:
  enabled: true
  schedule: "0 7 * * *"   # daily 07:00 -- quiet window after the previous night's last
                          # cycle (22:30) and before the day's first poll (10:00), so the
                          # read-only scan never overlaps an archiving run
  # Recalculates sha256 of EVERY file instead of comparing sizes.
  # Re-reads the entire volume: enable only on suspected silent corruption,
  # or temporarily via `kubectl create job --from=...`.
  deep: false
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Scheduled polling -- the daily poller. See templates/scheduler-cronjob.yaml
# for detail on choices (concurrencyPolicy, backoffLimit, token store persistence).
scheduler:
  enabled: true
  # Three cycles a day (10:00, 15:00, 22:00): the 10:00 run captures the night data
  # (sleep, HRV) once Garmin has consolidated it, the 15:00 and 22:00 runs surface the
  # day's activities soon after the watch syncs. Every run polls ALL endpoints -- there
  # is no health-only vs activity-only run. Frequency carries no lockout risk: each run
  # REUSES the persisted token (see t0.garmin.client.login), it does not re-authenticate.
  # `refreshLookbackDays` (code side, default 3) re-polls recent days anyway, so late
  # consolidation is never lost.
  schedule: "0 10,15,22 * * *"
  # Limit on windows processed per endpoint and run. It spreads initial catchup
  # over several days instead of sending hundreds of calls on the first run --
  # which is also what protects the account.
  maxWindowsPerEndpoint: 60
  # Download original files (.FIT/.TCX) of polled activities. Only source of
  # second-by-second data; disable only for a purely JSON catchup run.
  activityFiles: true
  # MUST remain identical to `opsBackfill.endpoints` below.
  endpoints:
    - get_sleep_data
    - get_hrv_data
    - get_rhr_day
    - get_stress_data
    - get_body_battery
    - get_steps_data
    - get_floors
    - get_intensity_minutes_data
    - get_training_readiness
    - get_training_status
    - get_body_composition
    - get_max_metrics
    - get_activities_by_date
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Historical catchup summary -- read-only MONITORING job: it prints windows
# still due, polls none (catchup is done by polling itself, processing oldest
# windows first).
#
# The WindowFetcher -> GarminClient adapter being now wired (the `scheduler`
# CronJob below polls for real), this summary makes sense again: it reports
# lag that shrinks run after run, not permanent lag anymore. Can be enabled
# at the same time as `scheduler.enabled`.
opsBackfill:
  enabled: true
  schedule: "0 6 * * *"    # daily 06:00 -- reports the lag left by the previous day's
                           # three polling cycles (read-only monitoring, polls nothing)
  # MUST remain ALIGNED with the polling history start date: a mismatch would
  # report lag for a period nobody polls. Identical to
  # t0.ops.backfill.DEFAULT_HISTORY_START_ISO.
  historyStart: "2025-04-03"
  # MUST remain identical to `scheduler.endpoints` below: the summary compares
  # expected windows to polled windows, so an endpoint here and absent below
  # would report eternal lag, and vice versa would hide a real gap. Copy of
  # `t0.scheduler.catalog.DEFAULT_ENDPOINTS`.
  endpoints:
    - get_sleep_data
    - get_hrv_data
    - get_rhr_day
    - get_stress_data
    - get_body_battery
    - get_steps_data
    - get_floors
    - get_intensity_minutes_data
    - get_training_readiness
    - get_training_status
    - get_body_composition
    - get_max_metrics
    - get_activities_by_date
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# -----------------------------------------------------------------------
# NetworkPolicy -- disabled by default (homelab, network already trusted).
# When enabled: allows only traffic between chart components and outbound
# DNS + HTTPS (necessary for Garmin API) for ingest.
# -----------------------------------------------------------------------
networkPolicy:
  enabled: false
