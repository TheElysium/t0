{{- /*
Scheduled polling CronJob -- the daily poller proper.

Runs `python -m t0.scheduler`, which reads the persisted window state
(raw.poll_window), polls Garmin ONLY for the days that are due, records the raw
payloads, then archives the day's original activity files (.FIT/.TCX) on the PVC --
the only source of second-by-second data, which the JSON API does not provide.

This Job functionally REPLACES the former intent of an internal loop inside the
ingest Deployment (values `ingest.config.pollIntervalMinutes`, now inert): a CronJob
restarts cleanly after a failure, consumes nothing between runs, and keeps its
progress state in the database rather than in process memory.

`concurrencyPolicy: Forbid` is NOT a comfort detail: two simultaneous runs would
authenticate two Garmin sessions in parallel on the same account, and a burst of
authentications is precisely what gets a Garmin Connect account locked. The token
store is mounted from the PVC for the same reason: without persistence, every run
would redo a full SSO.

Historical catch-up has no separate Job: the scheduler fills the missing windows
since `historyStart` itself, at a rate of `--max-windows-per-endpoint` per run and
per endpoint. `ops-backfill-status` publishes the progress.
*/ -}}
{{- if .Values.scheduler.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "t0.fullname" . }}-scheduler
  labels:
    {{- include "t0.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  schedule: {{ .Values.scheduler.schedule | quote }}
  timeZone: {{ .Values.ingest.config.timezone | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .Values.scheduler.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.scheduler.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.scheduler.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      # No automatic retry: a failed window is already marked 'failed' in the
      # database and replayed on the next run. Immediately retrying the entire Job
      # would only repeat a call that just failed -- and if the cause is
      # authentication refused, it would accelerate account lockout.
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "t0.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: scheduler
        spec:
          restartPolicy: Never
          # No <SERVICE>_HOST/_PORT env injection: a Service named t0-mcp would
          # shadow T0_MCP_PORT (Settings env prefix) with a tcp:// URL.
          enableServiceLinks: false
          automountServiceAccountToken: false
          {{- include "t0.scheduling" . | nindent 10 }}
          # Same private GHCR image as the ingest Deployment: same pull secret,
          # or every CronJob on an uncached node dies in ImagePullBackoff.
          {{- if .Values.ingest.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml .Values.ingest.imagePullSecrets | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.ingest.securityContext | nindent 12 }}
          containers:
            - name: scheduler
              image: "{{ .Values.ingest.image.repository }}:{{ include "t0.ingest.imageTag" . }}"
              imagePullPolicy: {{ .Values.ingest.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.ingest.containerSecurityContext | nindent 16 }}
                seccompProfile:
                  type: RuntimeDefault
              command:
                - python
                - -m
                - t0.scheduler
                - --max-windows-per-endpoint
                - {{ .Values.scheduler.maxWindowsPerEndpoint | quote }}
                {{- if not .Values.scheduler.activityFiles }}
                - --no-activity-files
                {{- end }}
                {{- range .Values.scheduler.endpoints }}
                - --endpoint
                - {{ . | quote }}
                {{- end }}
              envFrom:
                - configMapRef:
                    name: {{ include "t0.fullname" . }}-ingest
              env:
                - name: T0_GARMIN_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.garminSecret.name }}
                      key: {{ .Values.garminSecret.usernameKey }}
                - name: T0_GARMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.garminSecret.name }}
                      key: {{ .Values.garminSecret.passwordKey }}
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "t0.postgresql.secretName" . }}
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "t0.postgresql.secretName" . }}
                      key: password
                - name: T0_POSTGRES_DSN
                  value: >-
                    postgresql://$(PGUSER):$(PGPASSWORD)@{{ include "t0.postgresql.host" . }}:{{ include "t0.postgresql.port" . }}/{{ .Values.postgresql.auth.database }}
                # Read-only root: everything Python runtime writes by default under
                # $HOME or in caches must go to /tmp.
                - name: HOME
                  value: /tmp
                - name: TMPDIR
                  value: /tmp
                - name: XDG_CACHE_HOME
                  value: /tmp/cache
                - name: XDG_CONFIG_HOME
                  value: /tmp/config
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: PYTHONPYCACHEPREFIX
                  value: /tmp/pycache
              resources:
                {{- toYaml .Values.scheduler.resources | nindent 16 }}
              volumeMounts:
                # Original file archive: written AND fsynced before database insert
                # (ELT principle, batch L3).
                - name: fit-archive
                  mountPath: {{ .Values.ingest.config.fitArchivePath }}
                  subPath: {{ .Values.fitArchive.subPaths.fitFiles }}
                # Garmin token store -- persistent, see the file header.
                - name: fit-archive
                  mountPath: {{ .Values.ingest.config.garminTokensPath }}
                  subPath: {{ .Values.fitArchive.subPaths.garminTokens }}
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: fit-archive
              persistentVolumeClaim:
                claimName: {{ include "t0.fitArchive.pvcName" . }}
            - name: tmp
              emptyDir:
                sizeLimit: {{ .Values.ingest.tmpDirSizeLimit }}
{{- end }}
