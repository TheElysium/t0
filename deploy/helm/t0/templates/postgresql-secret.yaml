{{- if not .Values.postgresql.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "t0.postgresql.secretName" . }}
  labels:
    {{- include "t0.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  {{- /*
    NO `helm.sh/resource-policy: keep` annotation here, deliberately:
      - it does NOT protect the Secret CONTENT during a `helm upgrade`
        (Helm replaces the data); it only prevents deletion;
      - it leaves the Secret orphaned after `helm uninstall`, which makes the
        next reinstall fail ("exists and cannot be imported into the current
        release").
    Password stability comes from the fact that it is SUPPLIED, never generated:
    see the t0.postgresql.password helper.
  */}}
type: Opaque
stringData:
  username: {{ .Values.postgresql.auth.username | quote }}
  password: {{ include "t0.postgresql.password" . | quote }}
{{- end }}
