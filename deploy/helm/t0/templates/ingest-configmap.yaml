apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "t0.fullname" . }}-ingest
  labels:
    {{- include "t0.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest
data:
  # Names must carry the T0_ prefix: `t0.settings.Settings`
  # is a BaseSettings with `env_prefix="T0_"`. A key without the prefix is
  # simply ignored (extra="ignore"), and the pod fails on startup with a missing
  # required field -- failure visible only in production.
  # SOLE EXCEPTION: GARMINTOKENS, read as-is by garminconnect 0.3.2 itself
  # (`os.getenv("GARMINTOKENS")`), hence the explicit `validation_alias` on Python side.
  GARMINTOKENS: {{ .Values.ingest.config.garminTokensPath | quote }}
  T0_FIT_ARCHIVE_PATH: {{ .Values.ingest.config.fitArchivePath | quote }}
  T0_HISTORY_START: {{ .Values.ingest.config.backfillStartDate | quote }}
  # ACTUAL DEFAULT CORRECTED: this key was called `LOG_LEVEL`, without the prefix --
  # exactly the case the above comment describes. No code ever read it, so setting
  # `ingest.config.logLevel` had no effect.
  # Read by t0.logging_setup.configure_logging (not by Settings:
  # a read-only ops tool must be able to adjust verbosity without providing
  # Garmin credentials).
  T0_LOG_LEVEL: {{ .Values.ingest.config.logLevel | quote }}
  TZ: {{ .Values.ingest.config.timezone | quote }}
  PGHOST: {{ include "t0.postgresql.host" . | quote }}
  PGPORT: {{ include "t0.postgresql.port" . | quote }}
  PGDATABASE: {{ .Values.postgresql.auth.database | quote }}
