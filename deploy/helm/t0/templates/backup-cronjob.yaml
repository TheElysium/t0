{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "t0.fullname" . }}-postgresql-backup
  labels:
    {{- include "t0.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  # All chart CronJobs share this timezone: without this field the controller
  # applies UTC, and the daily order announced in values.yaml would no longer
  # be what is actually executed -- with a shift that changes twice a year.
  timeZone: {{ .Values.ingest.config.timezone | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .Values.backup.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "t0.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          # No <SERVICE>_HOST/_PORT env injection: a Service named t0-mcp would
          # shadow T0_MCP_PORT (Settings env prefix) with a tcp:// URL.
          enableServiceLinks: false
          automountServiceAccountToken: false
          {{- include "t0.scheduling" . | nindent 10 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            # fsGroup ALIGNED with ingest pod: both pods mount the SAME PVC
            # (fit-archive). Two different fsGroups overwrite each other on every
            # mount (kubelet applies fsGroup recursively to the volume), and
            # ingest would lose write permission to its FIT archive and token store
            # after the first backup run.
            fsGroup: {{ .Values.ingest.securityContext.fsGroup }}
          containers:
            - name: pg-dump
              image: "{{ .Values.backup.image.repository }}:{{ .Values.backup.image.tag }}"
              imagePullPolicy: {{ .Values.backup.image.pullPolicy }}
              env:
                - name: PGHOST
                  value: {{ include "t0.postgresql.host" . | quote }}
                - name: PGPORT
                  value: {{ include "t0.postgresql.port" . | quote }}
                - name: PGDATABASE
                  value: {{ .Values.postgresql.auth.database | quote }}
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "t0.postgresql.secretName" . }}
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "t0.postgresql.secretName" . }}
                      key: password
                - name: BACKUP_DIR
                  value: /backups
                - name: PGCONNECT_TIMEOUT
                  value: "30"
                - name: RETENTION
                  value: {{ .Values.backup.retention | quote }}
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  timestamp=$(date -u +%Y%m%dT%H%M%SZ)
                  dumpfile="${BACKUP_DIR}/t0-${timestamp}.dump"
                  partial="${dumpfile}.part"

                  # An interrupted dump must never remain with its final name:
                  # it would be counted by rotation and could be chosen for
                  # restoration.
                  trap 'rm -f "${partial}"' EXIT

                  echo "Backup to ${dumpfile}"
                  # pg_dump is NOT piped: its exit code comes back directly,
                  # and `set -e` fails the Job. A backup that fails silently is
                  # worse than no backup.
                  if ! pg_dump --format=custom --no-password --file="${partial}"; then
                    echo "FAILURE: pg_dump returned non-zero, no backup produced." >&2
                    exit 1
                  fi
                  if [ ! -s "${partial}" ]; then
                    echo "FAILURE: produced dump is empty." >&2
                    exit 1
                  fi
                  mv "${partial}" "${dumpfile}"
                  trap - EXIT
                  echo "Dump completed: $(wc -c < "${dumpfile}") bytes."

                  # --- Rotation ---
                  # Deliberately without `ls -1t | tail | xargs -r`: `xargs -r`
                  # is a GNU extension whose presence is not guaranteed in
                  # alpine image busybox, and parsing `ls` output is fragile.
                  # Names carry fixed-width UTC timestamps, so lexicographic
                  # glob order (oldest to newest) IS chronological order.
                  echo "Retention: keeping ${RETENTION} most recent dumps"
                  total=0
                  for f in "${BACKUP_DIR}"/t0-*.dump; do
                    [ -f "${f}" ] || continue
                    total=$((total + 1))
                  done
                  surplus=$((total - RETENTION))
                  if [ "${surplus}" -gt 0 ]; then
                    n=0
                    for f in "${BACKUP_DIR}"/t0-*.dump; do
                      [ -f "${f}" ] || continue
                      n=$((n + 1))
                      [ "${n}" -le "${surplus}" ] || break
                      echo "Purging old dump: ${f}"
                      rm -f "${f}"
                    done
                  fi
                  echo "Backup completed (${total} dump(s) before purge)."
              volumeMounts:
                - name: fit-archive
                  mountPath: /backups
                  subPath: {{ .Values.fitArchive.subPaths.postgresBackups }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
          volumes:
            - name: fit-archive
              persistentVolumeClaim:
                claimName: {{ include "t0.fitArchive.pvcName" . }}
{{- end }}
