{{- if .Values.networkPolicy.enabled }}
{{- if .Values.postgresql.enabled }}
---
# PostgreSQL: accepts inbound traffic from any pod of the same release -- ingest,
# Grafana, the backup and ops CronJobs, and the migration hook Job. The selector is
# release-wide on purpose: a per-component list would have to be extended every time
# a workload is added, and forgetting it fails as a connection timeout at 3 a.m.
# No egress policy targets those pods, so they reach DNS and PostgreSQL freely.
# External server (postgresql.enabled=false): nothing to select in this namespace,
# the egress rules below carry the peer instead.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "t0.fullname" . }}-postgresql
  labels:
    {{- include "t0.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "t0.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "t0.selectorLabels" . | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
{{- end }}
---
# Ingest: outbound allowed to PostgreSQL, DNS, and HTTPS (Garmin API).
# No inbound required unless the FIT upload port is used from another pod
# in the same Release (port-forward is not subject to NetworkPolicy:
# it talks directly to kubelet/pod).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "t0.fullname" . }}-ingest
  labels:
    {{- include "t0.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "t0.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ingest
  policyTypes:
    - Egress
  egress:
    {{- include "t0.postgresqlEgressRule" . | nindent 4 }}
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
---
# Grafana: outbound allowed to PostgreSQL and DNS, plus HTTPS while Grafana plugins
# are installed (GF_INSTALL_PLUGINS downloads them from grafana.com at startup).
#
# No Ingress rule on purpose, so nothing here blocks a LoadBalancer Service (see
# grafana.service.type): the policy governs what Grafana may REACH, not who may
# reach Grafana. Adding an Ingress rule would silently break LAN access.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "t0.fullname" . }}-grafana
  labels:
    {{- include "t0.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "t0.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  policyTypes:
    - Egress
  egress:
    {{- include "t0.postgresqlEgressRule" . | nindent 4 }}
    # DNS. The datasource points at the PostgreSQL Service by NAME, so without this
    # rule every panel fails to resolve it and Grafana reports a connection error
    # that looks like a database outage.
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if gt (len (include "t0.grafana.plugins" . | fromJsonArray)) 0 }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
    {{- end }}
---
# MCP: outbound to PostgreSQL and DNS only -- the tools are curated reads,
# the server never calls out. No Ingress rule, same posture as Grafana above.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "t0.fullname" . }}-mcp
  labels:
    {{- include "t0.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "t0.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp
  policyTypes:
    - Egress
  egress:
    {{- include "t0.postgresqlEgressRule" . | nindent 4 }}
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
