{{- if .Values.grafana.enabled }}
{{- if not .Values.grafana.admin.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "t0.grafana.secretName" . }}
  labels:
    {{- include "t0.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
type: Opaque
stringData:
  admin-user: {{ .Values.grafana.admin.user | quote }}
  admin-password: {{ include "t0.grafana.adminPassword" . | quote }}
{{- end }}
{{- end }}
