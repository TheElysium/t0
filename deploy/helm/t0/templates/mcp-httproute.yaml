{{- if and .Values.mcp.enabled .Values.mcp.gateway.enabled }}
{{- $hostname := trim .Values.mcp.gateway.hostname | default "" }}
{{- if not $hostname }}
{{- fail "\n\nERROR: mcp.gateway.enabled = true but mcp.gateway.hostname is empty.\n\nAn HTTPRoute publishes the MCP under the hostname it declares: an implicit default\nwould silently expose it under a name nobody chose. Set the hostname explicitly:\n\n  mcp:\n    gateway:\n      enabled: true\n      hostname: t0-mcp.homelab.internal\n\nThe hostname must be covered by the wildcard DNS record pointing at the Gateway\naddress (e.g. *.homelab.internal -> 192.168.1.212). The MCP stays behind its\nBearer token either way -- the hostname only decides WHERE it answers.\n" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "t0.fullname" . }}-mcp
  labels:
    {{- include "t0.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  parentRefs:
    {{- toYaml .Values.mcp.gateway.parentRefs | nindent 4 }}
  hostnames:
    - {{ $hostname | quote }}
  rules:
    - backendRefs:
        - name: {{ include "t0.fullname" . }}-mcp
          port: {{ .Values.mcp.service.port }}
{{- end }}
