{{- if and .Values.mcp.enabled (not .Values.mcp.auth.bearerTokenExistingSecret) }}
{{- /*
Chart-created Bearer token Secret -- only path left when no existing Secret is
referenced. The value is SUPPLIED, never generated (see t0.mcp.bearerToken):
the chart fails to render when `mcp.auth.bearerToken` is empty too. Preferred
form in a real deployment remains `bearerTokenExistingSecret`.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "t0.mcp.bearerSecretName" . }}
  labels:
    {{- include "t0.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
type: Opaque
stringData:
  {{ .Values.mcp.auth.bearerTokenKey }}: {{ include "t0.mcp.bearerToken" . | quote }}
{{- end }}
