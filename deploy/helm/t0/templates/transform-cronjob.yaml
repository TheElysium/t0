{{- /*
CronJob for transformation `raw.fit_file` -> `core.*`.

This is the missing link: polling (scheduler) archives files and inserts `raw.*`
rows, ops-refresh refreshes `mart.*` views, but nothing filled `core.*` between
the two. A refresh on empty `core.*` tables SUCCEEDS -- it recopies emptiness --
and dashboards stay blank with no alarm. Hence this Job's place in the day:
AFTER polling (05:00) and BEFORE `ops-refresh` (05:30).

This Job READS the original file archive (`storage_path` of `raw.fit_file` is
an absolute path under `ingest.config.fitArchivePath`): the PVC must therefore
be mounted at the SAME mount point as in the polling CronJob, otherwise paths
stored in the database resolve nowhere. It is mounted read-only, as for
`ops-reconcile`: transformation has no reason to write to the archive, and the
guarantee is better written in the manifest than assumed in the code.

Reuses the ingest image (`.Values.ingest.image`): `t0.transform` is
part of the same Python package, delivered in the same image.
*/ -}}
{{- if .Values.transform.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "t0.fullname" . }}-transform
  labels:
    {{- include "t0.labels" . | nindent 4 }}
    app.kubernetes.io/component: transform
spec:
  schedule: {{ .Values.transform.schedule | quote }}
  # Without this field, the controller applies UTC while the polling CronJob runs
  # in local time: the real window between the two Jobs would no longer be what
  # values.yaml announces, and would change twice a year.
  timeZone: {{ .Values.ingest.config.timezone | quote }}
  # Two simultaneous runs would corrupt nothing (writes are idempotent and
  # `parsed_at` removes the file from the queue), but they would compete for
  # the same rows to redo the same work. Forbid prevents piling up.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .Values.transform.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.transform.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.transform.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      # A faulty file is isolated by the code (parse_error) and does not fail the
      # run: an exit code 1 therefore signals an already-logged incident that
      # replaying identically will not fix. Two attempts at most, to cover the
      # only truly transient cause (database unavailable at pod startup).
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "t0.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: transform
        spec:
          restartPolicy: OnFailure
          # This Job only talks to PostgreSQL and the PVC: no Garmin credentials,
          # no service account token.
          automountServiceAccountToken: false
          {{- include "t0.scheduling" . | nindent 10 }}
          securityContext:
            {{- toYaml .Values.ingest.securityContext | nindent 12 }}
          containers:
            - name: transform
              image: "{{ .Values.ingest.image.repository }}:{{ include "t0.ingest.imageTag" . }}"
              imagePullPolicy: {{ .Values.ingest.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.ingest.containerSecurityContext | nindent 16 }}
                seccompProfile:
                  type: RuntimeDefault
              command: ["python", "-m", "t0.transform"]
              args:
                - "--limit"
                - {{ .Values.transform.batchLimit | quote }}
              env:
                # PGUSER/PGPASSWORD MUST be defined before T0_POSTGRES_DSN
                # below: Kubernetes only resolves $(VAR) among variables ALREADY
                # declared earlier in the same `env` list (array order, not
                # alphabetical order).
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "t0.postgresql.secretName" . }}
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "t0.postgresql.secretName" . }}
                      key: password
                # DSN provided via environment variable, NEVER via an --dsn
                # argument: a command-line argument is visible in plain text in
                # the process list, including via `kubectl describe pod`
                # (spec.containers[].command).
                - name: T0_POSTGRES_DSN
                  value: >-
                    postgresql://$(PGUSER):$(PGPASSWORD)@{{ include "t0.postgresql.host" . }}:{{ include "t0.postgresql.port" . }}/{{ .Values.postgresql.auth.database }}
                # This Job does not mount the ingest ConfigMap (it needs no Garmin
                # settings): verbosity is picked up here alone, from the same value,
                # so a single setting applies everywhere.
                - name: T0_LOG_LEVEL
                  value: {{ .Values.ingest.config.logLevel | quote }}
                # Read-only root: everything Python runtime writes by default under
                # $HOME or in caches must go to /tmp.
                - name: HOME
                  value: /tmp
                - name: TMPDIR
                  value: /tmp
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: PYTHONPYCACHEPREFIX
                  value: /tmp/pycache
              resources:
                {{- toYaml .Values.transform.resources | nindent 16 }}
              volumeMounts:
                # SAME mountPath as the polling CronJob: `storage_path` is an
                # absolute path stored in the database during archiving.
                - name: fit-archive
                  mountPath: {{ .Values.ingest.config.fitArchivePath }}
                  subPath: {{ .Values.fitArchive.subPaths.fitFiles }}
                  # Mechanical guarantee, not a convention: this Job cannot write
                  # to the archive, regardless of what the code does.
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: fit-archive
              persistentVolumeClaim:
                claimName: {{ include "t0.fitArchive.pvcName" . }}
                readOnly: true
            - name: tmp
              emptyDir:
                sizeLimit: {{ .Values.ingest.tmpDirSizeLimit }}
{{- end }}
