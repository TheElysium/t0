apiVersion: v1
kind: Service
metadata:
  name: {{ include "t0.postgresql.serviceName" . }}
  labels:
    {{- include "t0.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  clusterIP: None
  # Headless Service (local access only): internal DNS discovery within
  # cluster, no LoadBalancer, no Ingress.
  publishNotReadyAddresses: true
  selector:
    {{- include "t0.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  ports:
    - name: postgresql
      port: {{ .Values.postgresql.service.port }}
      targetPort: postgresql
