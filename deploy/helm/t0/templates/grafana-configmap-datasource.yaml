{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "t0.fullname" . }}-grafana-datasource
  labels:
    {{- include "t0.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: PostgreSQL
        type: postgres
        access: proxy
        url: {{ include "t0.postgresql.host" . }}:{{ include "t0.postgresql.port" . }}
        database: {{ .Values.postgresql.auth.database }}
        user: $POSTGRESQL_USER
        isDefault: true
        editable: false
        secureJsonData:
          password: $POSTGRESQL_PASSWORD
        jsonData:
          sslmode: disable
          postgresVersion: 1600
          timescaledb: false
{{- end }}
