{{- if .Values.mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "t0.fullname" . }}-mcp
  labels:
    {{- include "t0.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  # Stateless Streamable HTTP server, no local session, no PVC: replicas are
  # safe here, unlike ingest (whose Recreate strategy exists for the Garmin
  # session, which the MCP does not have).
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      {{- include "t0.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        {{- include "t0.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp
      {{- if and (not .Values.mcp.auth.bearerTokenExistingSecret) .Values.mcp.auth.bearerToken }}
      annotations:
        # The Bearer token is injected via `env.valueFrom`, which is only read
        # at container startup: without this checksum, a token rotation in
        # values would leave the pod with the old token.
        checksum/mcp-auth-secret: {{ include (print $.Template.BasePath "/mcp-secret.yaml") . | sha256sum }}
      {{- end }}
    spec:
      # This pod never calls the Kubernetes API and holds no Garmin credential:
      # no service account token is mounted.
      automountServiceAccountToken: false
      # Same image, same registry as ingest -- hence the same pull secrets.
      {{- if .Values.ingest.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.ingest.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- include "t0.scheduling" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.mcp.securityContext | nindent 8 }}
      containers:
        - name: mcp
          # Same Docker image as ingest (see values.yaml mcp.image): the MCP is
          # another entry point of the same package, launched with an explicit
          # command because the image CMD is the ingest API server.
          image: "{{ .Values.mcp.image.repository }}:{{ include "t0.mcp.imageTag" . }}"
          imagePullPolicy: {{ .Values.mcp.image.pullPolicy }}
          command: ["python", "-m", "t0.mcp"]
          securityContext:
            {{- toYaml .Values.mcp.containerSecurityContext | nindent 12 }}
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: {{ .Values.mcp.service.port }}
          env:
            # Bearer token -- SECRET REFERENCE ONLY, never created in clear in
            # this manifest. Verified by the MCP ASGI middleware.
            - name: T0_MCP_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "t0.mcp.bearerSecretName" . }}
                  key: {{ .Values.mcp.auth.bearerTokenKey }}
            # DSN of the dedicated read-only role t0_mcp_ro -- NEVER the
            # application credentials of t0.postgresql. Pre-existing Secret,
            # created server-side (CNPG managed.roles): see values.yaml
            # mcp.postgres and README.md. Passed as an environment variable,
            # never as a command-line argument (visible in the process list).
            - name: T0_MCP_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "t0.mcp.dsnSecretName" . }}
                  key: {{ .Values.mcp.postgres.dsnKey }}
            # Read-only connection guardrails (statement_timeout) and output
            # safety LIMIT -- read by the app through t0.settings (T0_ prefix).
            - name: T0_MCP_STATEMENT_TIMEOUT_MS
              value: {{ .Values.mcp.config.statementTimeoutMs | quote }}
            - name: T0_MCP_MAX_ROWS
              value: {{ .Values.mcp.config.maxRows | quote }}
            # Must match containerPort/Service port above: the app default
            # (8000) would otherwise desynchronize the probes and the Service.
            - name: T0_MCP_PORT
              value: {{ .Values.mcp.service.port | quote }}
            # Same logging convention as ingest: read by t0.logging_setup, not
            # by Settings (see ingest-configmap.yaml).
            - name: T0_LOG_LEVEL
              value: {{ .Values.mcp.config.logLevel | quote }}
            # --- Writeable paths compatible with readOnlyRootFilesystem ---
            # Same redirection as ingest: the container root is read-only, so
            # everything the Python runtime writes under $HOME or in caches
            # must land in /tmp (emptyDir). The MCP mounts no PVC.
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/cache
            - name: XDG_CONFIG_HOME
              value: /tmp/config
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONPYCACHEPREFIX
              value: /tmp/pycache
          livenessProbe:
            {{- toYaml .Values.mcp.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.mcp.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
          volumeMounts:
            # Root filesystem read-only: /tmp writable via dedicated emptyDir.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.mcp.tmpDirSizeLimit }}
{{- end }}
