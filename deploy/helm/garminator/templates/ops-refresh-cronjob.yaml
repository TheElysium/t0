{{- /*
CronJob for refreshing materialized views mart.* (batch L10).

Driven by the `opsRefresh` block in values.yaml (integrated now; the previous
header wrongly claimed these keys were still missing). It refreshes the
materialized views mart.* that Grafana queries: without it, dashboards stay
frozen at the last manual REFRESH.

Intentionally reuses the ingest image (`.Values.ingest.image`): the
`garminator.ops` module is part of the same Python package as ingest,
delivered in the same container image -- no separate image to build or
maintain for this batch.
*/ -}}
{{- if .Values.opsRefresh.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "garminator.fullname" . }}-ops-refresh
  labels:
    {{- include "garminator.labels" . | nindent 4 }}
    app.kubernetes.io/component: ops-refresh
spec:
  schedule: {{ .Values.opsRefresh.schedule | quote }}
  # Without this field, the controller applies UTC while the polling CronJob runs
  # in local time: the real window between the two Jobs would no longer be what
  # values.yaml announces, and would change twice a year.
  timeZone: {{ .Values.ingest.config.timezone | quote }}
  # A refresh still running must never meet a second one: REFRESH MATERIALIZED VIEW
  # CONCURRENTLY takes a write lock on the view for the duration: a second run would
  # just wait (or fail on timeout), never corrupting anything, but Forbid prevents
  # unnecessary piling up of blocked Jobs.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .Values.opsRefresh.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.opsRefresh.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.opsRefresh.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "garminator.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: ops-refresh
        spec:
          restartPolicy: OnFailure
          # This Job only talks to PostgreSQL: no Garmin credentials, no service
          # account token.
          automountServiceAccountToken: false
          securityContext:
            {{- toYaml .Values.ingest.securityContext | nindent 12 }}
          containers:
            - name: ops-refresh
              image: "{{ .Values.ingest.image.repository }}:{{ include "garminator.ingest.imageTag" . }}"
              imagePullPolicy: {{ .Values.ingest.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.ingest.containerSecurityContext | nindent 16 }}
                seccompProfile:
                  type: RuntimeDefault
              command: ["python", "-m", "garminator.ops", "refresh"]
              env:
                # PGUSER/PGPASSWORD MUST be defined before GARMINATOR_POSTGRES_DSN
                # below: Kubernetes only resolves $(VAR) among variables ALREADY
                # declared earlier in the same `env` list (array order, not
                # alphabetical order).
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "garminator.postgresql.secretName" . }}
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "garminator.postgresql.secretName" . }}
                      key: password
                # DSN provided via environment variable, NEVER via an --dsn
                # argument: a command-line argument is visible in plain text in the
                # container process list, including via `kubectl describe pod`
                # (spec.containers[].command).
                - name: GARMINATOR_POSTGRES_DSN
                  value: >-
                    postgresql://$(PGUSER):$(PGPASSWORD)@{{ include "garminator.postgresql.serviceName" . }}:{{ .Values.postgresql.service.port }}/{{ .Values.postgresql.auth.database }}
                # This Job does not mount the ingest ConfigMap (it needs no Garmin
                # settings): verbosity is picked up here alone, from the same value,
                # so a single setting applies everywhere.
                - name: GARMINATOR_LOG_LEVEL
                  value: {{ .Values.ingest.config.logLevel | quote }}
                - name: HOME
                  value: /tmp
                - name: TMPDIR
                  value: /tmp
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: PYTHONPYCACHEPREFIX
                  value: /tmp/pycache
              resources:
                {{- toYaml .Values.opsRefresh.resources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: {{ .Values.ingest.tmpDirSizeLimit }}
{{- end }}
