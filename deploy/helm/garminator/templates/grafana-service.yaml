{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "garminator.fullname" . }}-grafana
  labels:
    {{- include "garminator.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  # ClusterIP uniquement : accès par `kubectl port-forward`, aucun Ingress.
{{- include "garminator.assertLocalOnlyService" (dict "key" "grafana.service.type" "type" .Values.grafana.service.type) }}
  type: {{ .Values.grafana.service.type }}
  selector:
    {{- include "garminator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
  ports:
    - name: http
      port: {{ .Values.grafana.service.port }}
      targetPort: http
{{- end }}
