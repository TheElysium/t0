{{- /*
CronJob for historical catchup monitoring (batch L10).

IMPORTANT -- actual scope of this Job: it does NOT execute network catchup.
It only calls `python -m garminator.ops backfill-status`, which is a
READ-ONLY REPORT ("how many windows remain, since when"), read from
`raw.poll_window`. The actual polling is done by the `scheduler-cronjob.yaml`
CronJob (`python -m garminator.scheduler`), which replays `pending`/`failed`
windows itself: there is thus no separate "catchup" command to invoke here, and
this Job is not meant to acquire one.

The `--history-start` passed here must stay aligned with `GARMINATOR_HISTORY_START`
(ingest ConfigMap): otherwise this report compares a different scope from what
is actually collected and reports holes that are not. `tests/test_config_coherence.py`
verifies this alignment.
*/ -}}
{{- if .Values.opsBackfill.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "garminator.fullname" . }}-ops-backfill-status
  labels:
    {{- include "garminator.labels" . | nindent 4 }}
    app.kubernetes.io/component: ops-backfill-status
spec:
  schedule: {{ .Values.opsBackfill.schedule | quote }}
  # All chart CronJobs share this timezone: without this field the controller
  # applies UTC, and the daily order announced in values.yaml would no longer
  # be what is actually executed -- with a shift that changes twice a year.
  timeZone: {{ .Values.ingest.config.timezone | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .Values.opsBackfill.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.opsBackfill.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.opsBackfill.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "garminator.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: ops-backfill-status
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            {{- toYaml .Values.ingest.securityContext | nindent 12 }}
          containers:
            - name: ops-backfill-status
              image: "{{ .Values.ingest.image.repository }}:{{ include "garminator.ingest.imageTag" . }}"
              imagePullPolicy: {{ .Values.ingest.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.ingest.containerSecurityContext | nindent 16 }}
                seccompProfile:
                  type: RuntimeDefault
              command:
                - python
                - -m
                - garminator.ops
                - backfill-status
                - --history-start
                - {{ .Values.opsBackfill.historyStart | quote }}
                {{- range .Values.opsBackfill.endpoints }}
                - --endpoint
                - {{ . | quote }}
                {{- end }}
              env:
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "garminator.postgresql.secretName" . }}
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "garminator.postgresql.secretName" . }}
                      key: password
                - name: GARMINATOR_POSTGRES_DSN
                  value: >-
                    postgresql://$(PGUSER):$(PGPASSWORD)@{{ include "garminator.postgresql.serviceName" . }}:{{ .Values.postgresql.service.port }}/{{ .Values.postgresql.auth.database }}
                # This Job does not mount the ingest ConfigMap (it needs no Garmin
                # settings): verbosity is picked up here alone, from the same value,
                # so a single setting applies everywhere.
                - name: GARMINATOR_LOG_LEVEL
                  value: {{ .Values.ingest.config.logLevel | quote }}
                - name: HOME
                  value: /tmp
                - name: TMPDIR
                  value: /tmp
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: PYTHONPYCACHEPREFIX
                  value: /tmp/pycache
              resources:
                {{- toYaml .Values.opsBackfill.resources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: {{ .Values.ingest.tmpDirSizeLimit }}
{{- end }}
