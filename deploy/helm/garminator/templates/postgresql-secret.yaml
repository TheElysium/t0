{{- if not .Values.postgresql.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "garminator.postgresql.secretName" . }}
  labels:
    {{- include "garminator.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  {{- /*
    PAS d'annotation `helm.sh/resource-policy: keep` ici, volontairement :
      - elle ne protege PAS le CONTENU du Secret lors d'un `helm upgrade`
        (Helm remplace les donnees) ; elle n'empeche que la suppression ;
      - elle laisse le Secret orphelin apres `helm uninstall`, ce qui fait
        echouer la reinstallation suivante ("exists and cannot be imported
        into the current release").
    La stabilite du mot de passe est assuree par le fait qu'il est FOURNI,
    jamais genere : voir le helper garminator.postgresql.password.
  */}}
type: Opaque
stringData:
  username: {{ .Values.postgresql.auth.username | quote }}
  password: {{ include "garminator.postgresql.password" . | quote }}
{{- end }}
